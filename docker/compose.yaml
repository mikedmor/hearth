# Hearth in its own folder. See guides/install.md.
#
#   mkdir -p hearth/data && cd hearth
#   curl -fsSLO https://raw.githubusercontent.com/mikedmor/hearth/main/docker/compose.yaml
#   umask 077; printf "HEARTH_SECRET_KEY=%s\n" "$(openssl rand -base64 32)" > .env
#   docker compose up -d
#
# To update: docker compose pull && docker compose up -d
# Only Hearth's container is started; nothing else on the machine is touched.
services:
  hearth:
    # `1` follows every 1.x release (updates never need you to change anything). Pin an exact
    # version like 1.0.0 to update only when you choose.
    image: ghcr.io/mikedmor/hearth:1
    # Building from source instead: clone the repository into ./src, comment out `image:` above,
    # and uncomment these. Then `docker compose up -d --build`.
    # build:
    #   context: ./src
    #   dockerfile: Dockerfile
    # image: hearth:local
    container_name: hearth
    restart: unless-stopped
    # Must own ./data on the host. Run `id` to see yours (Synology's first user is often 1026:100).
    user: "1000:1000"
    ports:
      - "8082:8082"
    environment:
      TZ: America/New_York # your time zone
      # Encrypts widget keys, AI keys and calendar sign-ins. Keep a copy somewhere safe.
      HEARTH_SECRET_KEY: ${HEARTH_SECRET_KEY:?set HEARTH_SECRET_KEY in .env next to this file}
      # If your home has its own certificate authority, let Hearth trust it, so status checks
      # and widgets can reach https:// services that use it (and mount the root below).
      # NODE_EXTRA_CA_CERTS: /certs/root_ca.crt
    volumes:
      - ./data:/data
      # The public root certificate only, read-only. Never a private key.
      # - /path/to/root_ca.crt:/certs/root_ca.crt:ro
